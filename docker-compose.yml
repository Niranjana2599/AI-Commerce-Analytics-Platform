services:
  grafana:
    image: grafana/grafana:13.1.0
    container_name: ai-commerce-grafana

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"

    ports:
      - "${GRAFANA_PORT:-3000}:3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      prometheus:
        condition: service_healthy

    networks:
      - ai-commerce-network

    healthcheck:
      test: ["CMD", "wget", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

    restart: unless-stopped


  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: ai-commerce-prometheus

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle

    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    networks:
      - ai-commerce-network

    healthcheck:
      test: ["CMD", "wget", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    restart: unless-stopped


  node-exporter:
    image: prom/node-exporter:v1.11.1
    container_name: ai-commerce-node-exporter

    command:
      - --path.rootfs=/host

    pid: host

    volumes:
      - /:/host:ro

    networks:
      - ai-commerce-network

    restart: unless-stopped


  cadvisor:
    image: ghcr.io/google/cadvisor:v0.57.0
    container_name: ai-commerce-cadvisor

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

    networks:
      - ai-commerce-network

    restart: unless-stopped


  mlflow:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: ai-commerce-mlflow

    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow:5000,localhost:*,127.0.0.1:*"

    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000

    ports:
      - "${MLFLOW_PORT:-5000}:5000"

    volumes:
      - ./mlflow:/mlflow

    networks:
      - ai-commerce-network

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/health', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    restart: unless-stopped


  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: ai-commerce-backend

    environment:
      APP_ENV: ${APP_ENV:-production}

      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8501}

      MASTER_DATA_PATH: /app/data/processed/master_df.parquet

      MODELS_DIR: /app/models

      MLFLOW_TRACKING_URI: http://mlflow:5000

      RAG_OPS_DIR: /app/rag_ops

      # --------------------------------------------------------
      # RAG / Ollama
      # --------------------------------------------------------

      # Enable actual LLM generation through Ollama.
      RAG_LLM_ENABLED: ${RAG_LLM_ENABLED:-true}

      # Ollama is running on the Windows host.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}

      # Local Ollama model.
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}

      # --------------------------------------------------------
      # Optional LangSmith tracing
      # --------------------------------------------------------

      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}

      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}

      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-AI-Commerce-Analytics-Platform}

      LANGCHAIN_ENDPOINT: ${LANGCHAIN_ENDPOINT:-https://api.smith.langchain.com}

      LANGSMITH_WORKSPACE_ID: ${LANGSMITH_WORKSPACE_ID:-}

    ports:
      - "${BACKEND_PORT:-8000}:8000"

    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
      - ./mlflow:/mlflow
      - ./rag_ops:/app/rag_ops

    depends_on:
      mlflow:
        condition: service_healthy

    networks:
      - ai-commerce-network

    # Allows the Docker container to access Ollama
    # running on the Windows host.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped


  streamlit:
    build:
      context: .
      dockerfile: streamlit/Dockerfile

    container_name: ai-commerce-streamlit

    environment:
      FASTAPI_BASE_URL: http://backend:8000/api/v1

    ports:
      - "${STREAMLIT_PORT:-8501}:8501"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - ai-commerce-network

    restart: unless-stopped


# ------------------------------------------------------------
# Shared application network
# ------------------------------------------------------------

networks:
  ai-commerce-network:
    name: ai-commerce-network
    driver: bridge


# ------------------------------------------------------------
# Persistent volumes
# ------------------------------------------------------------

volumes:
  prometheus_data:
  grafana_data: